<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐播放器</title>
    <link rel="icon" type="image/svg+xml" href="/assets/Server.svg">
    <link rel="shortcut icon" type="image/svg+xml" href="/assets/Server.svg">
    <!-- 本地资源 -->
    <link href="/assets/css/tailwind.min.css" rel="stylesheet">
    <link href="/assets/css/font-awesome.min.css" rel="stylesheet">
    <!-- 全站设计系统：统一色板与令牌 -->
    <link href="/assets/css/theme.css" rel="stylesheet">
    <script src="/assets/js/accent.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#4E7BF0',
                        dark: {
                            100: '#1C1C1E',
                            200: '#141416',
                            300: '#0F0F11'
                        },
                        light: {
                            100: '#F5F5F7',
                            200: '#EFEFF2',
                            300: '#E5E6EB'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* ============================================================
           音乐播放器 — 按屏幕尺寸切换布局模式
           ------------------------------------------------------------
           三种模式（由 min-width 断点决定）：
             · 紧凑  < 640px   竖排：封面在上、信息在下、播放列表折叠成底部抽屉
             · 中等  640–1023  竖排：封面与信息居中放大，播放列表占下方固定区
             · 宽屏  ≥ 1024px  左右分栏：左侧封面+信息+控制，右侧常驻播放列表
           颜色全部走 theme.css 的设计令牌，不再硬编码 #165DFF 等色值。
           ============================================================ */

        html, body {
            margin: 0;
            height: 100%;
            background: var(--bg-app);
            color: var(--text);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
        }

        body {
            overflow: hidden;
        }

        .music-body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* ---- 关闭按钮 ----
           窄屏/中等：贴右上角（此时右侧无面板，不会遮挡）
           宽屏：移到播放区右上角，避开右侧播放列表标题 */
        .player-close-btn {
            position: fixed;
            top: 1rem;
            right: 1rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-md);
            cursor: pointer;
            z-index: 50;
            transition: background var(--dur-base) ease, color var(--dur-base) ease,
                        transform var(--dur-fast) ease;
        }

        .player-close-btn:hover {
            background: var(--bg-app);
            color: var(--text);
            transform: scale(1.08);
        }

        .player-close-btn:active {
            transform: scale(0.94);
        }

        /* 宽屏：播放列表占右侧 340px，按钮需让开 */
        @media (min-width: 1024px) {
            .player-close-btn {
                right: calc(340px + 1rem);
            }
        }

        @media (min-width: 1600px) {
            .player-close-btn {
                right: calc(400px + 1rem);
            }
        }

        .player-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;              /* 移动端地址栏收缩时更准确 */
            overflow: hidden;
        }

        /* ---- 主播放区 ---- */
        .main-player {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2.5rem;
            padding: 2rem;
        }

        .album-art {
            width: 300px;
            height: 300px;
            flex-shrink: 0;
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: var(--bg-sunken);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .album-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .album-art i {
            font-size: 5rem;
            color: var(--text-tertiary);
        }

        .song-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
            max-width: 460px;
            color: var(--text);
        }

        .song-title {
            font-size: 1.75rem;
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 0.4rem;
            /* 长歌名截断而非撑破布局 */
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .song-artist {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 1.25rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ---- 进度条 ---- */
        .progress-container {
            width: 100%;
            max-width: 400px;
            margin: 0.5rem 0;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--divider);
            border-radius: var(--radius-pill);
            overflow: hidden;
            cursor: pointer;
        }

        .progress {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }

        /* ---- 控制按钮 ---- */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.9rem;
            margin-top: 1.5rem;
        }

        .control-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: background var(--dur-base) ease, color var(--dur-base) ease,
                        transform var(--dur-fast) ease, border-color var(--dur-base) ease;
        }

        .control-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--text-on-primary);
            transform: scale(1.06);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .control-btn i {
            font-size: 1.1rem;
        }

        .play-btn {
            width: 64px;
            height: 64px;
            background: var(--primary);
            border-color: var(--primary);
            color: var(--text-on-primary);
            box-shadow: 0 6px 18px var(--primary-soft-strong);
        }

        .play-btn:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
            color: var(--text-on-primary);
        }

        .play-btn i {
            font-size: 1.4rem;
        }

        /* 循环模式状态：顺序=中性，单曲/列表=主色高亮 */
        .control-btn.is-active {
            color: var(--primary);
            border-color: var(--primary-soft);
            background: var(--primary-soft);
        }

        .control-btn.is-idle {
            color: var(--text-tertiary);
        }

        /* 单曲循环角标：跟随主色，不再硬编码 */
        .loop-badge {
            position: absolute;
            right: 2px;
            bottom: 2px;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: var(--primary);
            color: var(--text-on-primary);
            font-size: 0.55rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        /* ---- 播放列表 ---- */
        .playlist-container {
            display: flex;
            flex-direction: column;
            background: var(--bg-card-translucent);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-top: 1px solid var(--divider);
            min-height: 0;
            overflow: hidden;
        }

        .playlist-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.85rem 1.1rem;
            border-bottom: 1px solid var(--divider);
            flex-shrink: 0;
        }

        .playlist-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text);
        }

        /* 之前该类无任何样式，刷新按钮没有对齐；这里补齐 */
        .playlist-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .playlist-actions button {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.35rem 0.7rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg-app);
            color: var(--text-secondary);
            font-size: 0.8rem;
            cursor: pointer;
            transition: background var(--dur-fast) ease, color var(--dur-fast) ease,
                        border-color var(--dur-fast) ease;
        }

        .playlist-actions button:hover {
            background: var(--primary-soft);
            border-color: var(--primary-soft);
            color: var(--primary);
        }

        .playlist-refresh {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.35rem 0.7rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg-app);
            color: var(--text-secondary);
            font-size: 0.8rem;
            cursor: pointer;
            transition: background var(--dur-fast) ease, color var(--dur-fast) ease,
                        border-color var(--dur-fast) ease;
        }

        .playlist-refresh:hover {
            background: var(--primary-soft);
            border-color: var(--primary-soft);
            color: var(--primary);
        }

        .playlist-items {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 0.7rem;
            border-radius: var(--radius-sm);
            margin-bottom: 0.35rem;
            cursor: pointer;
            transition: background var(--dur-fast) ease;
        }

        .playlist-item:hover {
            background: var(--bg-app);
        }

        .playlist-item.active {
            background: var(--primary-soft);
        }

        .playlist-item.active .title {
            color: var(--primary);
            font-weight: 600;
        }

        .playlist-item .cover {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: var(--tint-primary-bg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .playlist-item .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .playlist-item .cover i {
            font-size: 1.1rem;
            color: var(--tint-primary-fg);
        }

        .playlist-item .info {
            flex: 1;
            min-width: 0;
        }

        .playlist-item .title {
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .playlist-item .artist {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 0.15rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .playlist-item .actions {
            display: flex;
            gap: 0.15rem;
            flex-shrink: 0;
            opacity: 0;
            transition: opacity var(--dur-fast) ease;
        }

        .playlist-item:hover .actions,
        .playlist-item.active .actions {
            opacity: 1;
        }

        @media (hover: none) {
            .playlist-item .actions { opacity: 1; }
        }

        .playlist-item .action-btn {
            width: 30px;
            height: 30px;
            border-radius: var(--radius-sm);
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: background var(--dur-fast) ease, color var(--dur-fast) ease;
        }

        .playlist-item .action-btn:hover {
            background: var(--divider);
            color: var(--primary);
        }

        .playlist-empty {
            padding: 2rem 1rem;
            text-align: center;
            color: var(--text-tertiary);
            font-size: 0.85rem;
        }

        /* ============================================================
           模式一：紧凑（< 640px）
           竖排、封面缩小、播放列表固定在下方的可滚动区
           ============================================================ */
        @media (max-width: 639px) {
            /* 移动端布局策略：
               控制区必须始终可见，不允许出现滚动条去"找"播放按钮。
               因此让封面自适应剩余空间：
                 可用高度 = 视口 - 播放列表 - 信息区 - 控制区 - 内边距
               封面用 flex:1 + aspect-ratio 吃掉剩余空间，
               并在极矮屏上收缩到最小值。 */
            .main-player {
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 0.7rem;
                padding: 0.75rem 1rem 0.9rem;
                overflow: hidden;          /* 不滚动：靠尺寸自适应 */
            }
            /* 封面用剩余空间驱动，而非视口宽度百分比。
               aspect-ratio 保证正方形，height:100% 让它在
               flex 空间里尽量撑开；max-height 兜住上限。 */
            .album-art {
                flex: 1 1 auto;
                width: auto;
                height: auto;
                min-height: 0;
                max-width: min(62vw, 240px);
                max-height: min(62vw, 240px);
                aspect-ratio: 1 / 1;
                /* 正方形由 aspect-ratio + max-* 共同约束：
                   flex 分配到的空间决定实际边长 */
                align-self: center;
            }
            .album-art img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .song-info {
                width: 100%;
                max-width: 100%;
                align-items: center;
                text-align: center;
                flex: 0 0 auto;
            }
            .song-title { font-size: 1.1rem; margin-bottom: 0.25rem; }
            .song-artist { font-size: 0.82rem; margin-bottom: 0.5rem; }
            .progress-container {
                max-width: 100%;
                margin: 0.15rem 0;
                flex: 0 0 auto;
            }
            .time-info { font-size: 0.72rem; margin-top: 0.3rem; }
            .controls {
                gap: 0.55rem;
                margin-top: 0.55rem;
                flex: 0 0 auto;            /* 控制区永不被压缩 */
            }
            .control-btn { width: 40px; height: 40px; flex-shrink: 0; }
            .play-btn { width: 52px; height: 52px; }
            /* 播放列表占据下方固定比例，且自身可滚动 */
            .playlist-container {
                flex: 0 0 auto;
                height: 32vh;
                min-height: 120px;
                max-height: 300px;
            }
            .playlist-header { padding: 0.55rem 0.9rem; }
            /* 关闭按钮挪到右上角，避免压住封面 */
            .player-close-btn {
                top: 0.55rem;
                right: 0.55rem;
                width: 34px;
                height: 34px;
            }
        }

        /* 极矮屏（横屏手机等）：进一步压缩，保证控制区不被吃掉 */
        @media (max-width: 639px) and (max-height: 620px) {
            .album-art { max-width: min(42vw, 150px); max-height: min(42vw, 150px); }
            .song-title { font-size: 1rem; }
            .song-artist { font-size: 0.78rem; margin-bottom: 0.35rem; }
            .playlist-container { height: 36vh; min-height: 104px; }
            .control-btn { width: 36px; height: 36px; }
            .play-btn { width: 46px; height: 46px; }
        }

        /* 横屏且很矮：隐藏封面，保证控制区不被挤掉 */
        @media (max-height: 480px) and (orientation: landscape) {
            .album-art { display: none; }
            .main-player { padding: 0.75rem; }
            .playlist-container { height: 40vh; }
        }

        /* ============================================================
           模式二：中等（640–1023px）
           竖排但放大展示，播放列表占下方固定高度
           ============================================================ */
        @media (min-width: 640px) and (max-width: 1023px) {
            .main-player {
                flex-direction: column;
                /* 与紧凑模式一致：靠尺寸自适应，不用滚动条 */
                justify-content: center;
                align-items: center;
                gap: 1rem;
                padding: 1.25rem 1.5rem 1.4rem;
                overflow: hidden;
            }
            .album-art {
                flex: 1 1 auto;
                width: auto;
                height: auto;
                min-height: 0;
                max-width: min(46vw, 280px);
                max-height: min(46vw, 280px);
                aspect-ratio: 1 / 1;
                align-self: center;
            }
            .song-info {
                width: 100%;
                max-width: 520px;
                align-items: center;
                text-align: center;
                flex: 0 0 auto;
            }
            .song-title { font-size: 1.4rem; }
            .progress-container { max-width: 100%; flex: 0 0 auto; }
            .controls { flex: 0 0 auto; }
            .playlist-container {
                flex: 0 0 auto;
                height: 30vh;
                min-height: 140px;
                max-height: 320px;
            }
        }

        /* ============================================================
           模式三：宽屏（≥ 1024px）
           左右分栏：左侧播放器，右侧常驻播放列表（占 1/3 宽）
           ============================================================ */
        @media (min-width: 1024px) {
            .player-container {
                flex-direction: row;
            }
            .main-player {
                flex: 1 1 auto;
                min-width: 0;
                padding: 3rem;
            }
            .album-art {
                width: min(32vw, 340px);
                height: min(32vw, 340px);
            }
            .song-info {
                max-width: 420px;
            }
            .playlist-container {
                flex: 0 0 340px;
                width: 340px;
                height: 100%;
                border-top: none;
                border-left: 1px solid var(--divider);
            }
        }

        /* 超宽屏：播放列表再放宽一点，避免右侧留白过多 */
        @media (min-width: 1600px) {
            .playlist-container {
                flex-basis: 400px;
                width: 400px;
            }
            .main-player { gap: 4rem; }
        }
    </style>
</head>
<body class="music-body">
    <div class="player-container">
        <!-- 主播放器区域 -->
        <div class="main-player">
            <div class="album-art">
                <img id="album-cover" src="" alt="Album Cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <i class="fa fa-music" style="display: none;"></i>
            </div>
            <div class="song-info">
                <div class="song-title" id="song-title">歌曲名称</div>
                <div class="song-artist" id="song-artist">艺术家</div>
                
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress" id="progress"></div>
                    </div>
                    <div class="time-info">
                        <span id="current-time">0:00</span>
                        <span id="total-time">0:00</span>
                    </div>
                </div>
                
                <div class="controls">
                    <button class="control-btn" id="prev-btn">
                        <i class="fa fa-step-backward"></i>
                    </button>
                    <button class="control-btn play-btn" id="play-btn">
                        <i class="fa fa-play"></i>
                    </button>
                    <button class="control-btn" id="next-btn">
                        <i class="fa fa-step-forward"></i>
                    </button>
                    <button class="control-btn" id="loop-btn" style="position:relative;">
                        <i class="fa fa-repeat"></i>
                    </button>
                    <button class="control-btn" id="volume-btn">
                        <i class="fa fa-volume-up"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 播放列表 -->
        <div class="playlist-container">
            <div class="playlist-header">
                <div class="playlist-title">播放列表</div>
                <div class="playlist-actions">
                    <button id="refresh-playlist" class="playlist-refresh">
                        <i class="fa fa-refresh"></i> 刷新
                    </button>
                </div>
            </div>
            <div class="playlist-items" id="playlist-items">
                <!-- 播放列表项将通过JavaScript动态添加 -->
            </div>
        </div>
    </div>

    <script>
        // 主题初始化
        (function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
            } else {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.classList.add('dark');
                }
            }
            window.addEventListener('themechange', (e) => {
                if (e.detail.theme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            });
        })();

        // 全局变量
        let currentSongIndex = 0;
        let playlist = [];
        let audio = new Audio();
        let isPlaying = false;
        let currentPath = '';
        let currentSongMeta = null; // 缓存当前歌曲的元数据
        let currentCoverUrl = null;
        let currentLoadingPath = null; // 跟踪当前正在加载的歌曲路径
        let loopMode = 0; // 0=顺序，1=单曲循环，2=列表循环

        // 从URL参数获取文件信息
        const urlParams = new URLSearchParams(window.location.search);
        let filePath = urlParams.get('path');
        
        // URL 解码文件路径
        try { filePath = decodeURIComponent(filePath); } catch(e){}

        if (!filePath) {
            alert('缺少必要参数');
            history.back();
        } else {
            // 提取目录路径
            currentPath = filePath.substring(0, filePath.lastIndexOf('/')) || '';

            // 从目录加载播放列表
            loadPlaylistFromDirectory(currentPath);
        }

        // 从目录加载音频文件作为播放列表
        async function loadPlaylistFromDirectory(path) {
            try {
                const response = await fetch('/api/cloud/audio/playlist', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ path: path })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    playlist = data.files.map(file => ({
                        name: file.name,
                        path: file.path,
                        index: file.index
                    }));
                    
                    // 找到当前播放的歌曲索引
                    currentSongIndex = playlist.findIndex(song => song.path === filePath);
                    
                    renderPlaylist();
                    loadSong(currentSongIndex);
                } else {
                    console.error('加载目录失败:', data.message);
                }
            } catch (error) {
                console.error('加载播放列表失败:', error);
            }
        }

        // 渲染播放列表
        function renderPlaylist() {
            const container = document.getElementById('playlist-items');
            container.innerHTML = '';
            
            playlist.forEach((song, index) => {
                const item = document.createElement('div');
                item.className = `playlist-item ${index === currentSongIndex ? 'active' : ''}`;
                item.dataset.index = index;

                // 优先显示ID3标签中的title，否则显示文件名
                let titleDisplay = song.name;
                let artistDisplay = song.path.split('/').slice(-2, -1)[0] || '';
                
                // 如果是当前播放的歌曲，使用缓存的ID3元数据
                if (index === currentSongIndex && currentSongMeta) {
                    if (currentSongMeta.title) {
                        titleDisplay = currentSongMeta.title;
                    }
                    if (currentSongMeta.artist) {
                        artistDisplay = currentSongMeta.artist;
                    }
                }

                item.innerHTML = `
                    <div class="cover">
                        <i class="fa fa-music"></i>
                    </div>
                    <div class="info">
                        <div class="title">${titleDisplay}</div>
                        <div class="artist">${artistDisplay}</div>
                    </div>
                    <div class="actions"></div>
                `;

                item.addEventListener('click', () => {
                    currentSongIndex = index;
                    loadSong(index);
                    renderPlaylist(); // 更新活动状态
                });

                container.appendChild(item);
            });
        }

        // 加载歌曲
        function loadSong(index) {
            if (index < 0 || index >= playlist.length) return;
            
            const song = playlist[index];
            const songUrl = `/api/cloud/download/${encodeURIComponent(song.path)}?inline=1`;
            
            // 标记当前正在加载的歌曲路径
            currentLoadingPath = song.path;
            
            // 更新音频源
            audio.src = songUrl;
            audio.load();
            
            // 默认使用文件信息，后面会尝试读取ID3元数据覆盖
            document.getElementById('song-title').textContent = song.name;
            document.getElementById('song-artist').textContent = song.path.split('/').slice(-2, -1)[0] || '未知艺术家';
            
            // 默认封面（后面可能被ID3中的封面覆盖）
            const albumCoverEl = document.getElementById('album-cover');
            albumCoverEl.src = `/api/cloud/audio/metadata?path=${encodeURIComponent(song.path)}`;
            
            // 尝试解析音频文件内的 ID3 元数据（仅读取前 200KB）
            const loadingPath = song.path; // 捕获当前加载的路径
            fetchID3Tags(song.path).then(meta => {
                // 只有当这是最新加载的歌曲时，才更新UI
                if (currentLoadingPath !== loadingPath) {
                    console.log('跳过过期的ID3数据:', loadingPath);
                    if (meta && meta.picture && typeof meta.picture === 'string' && meta.picture.startsWith('blob:')) {
                        URL.revokeObjectURL(meta.picture);
                    }
                    return;
                }
                
                // 撤销之前的封面 URL（如果是 blob URL）
                if (currentCoverUrl) {
                    try { URL.revokeObjectURL(currentCoverUrl); } catch(e){}
                    currentCoverUrl = null;
                }
                currentSongMeta = meta || null;
                if (!meta) return;
                if (meta.title) document.getElementById('song-title').textContent = meta.title;
                if (meta.artist) document.getElementById('song-artist').textContent = meta.artist;
                if (meta.album) {
                    // 可扩展：显示专辑名（目前页面没有专门位置）
                }
                if (meta.picture) {
                    // 使用内联图片（blob URL）
                    albumCoverEl.src = meta.picture;
                    currentCoverUrl = meta.picture;
                    albumCoverEl.style.display = '';
                    const icon = albumCoverEl.nextElementSibling;
                    if (icon) icon.style.display = 'none';
                }
                // 更新播放列表显示（使用元数据覆盖活动项名称）
                renderPlaylist();
            }).catch(err => {
                console.warn('读取ID3失败', err);
            });
            
            // 重置进度条
            document.getElementById('progress').style.width = '0%';
            document.getElementById('current-time').textContent = '0:00';
            
            // 自动播放
            setTimeout(() => {
                if (isPlaying) {
                    audio.play().catch(e => console.log('播放被阻止:', e));
                }
            }, 300);
        }

        // 格式化时间
        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // 绑定音频事件
        audio.addEventListener('loadedmetadata', () => {
            document.getElementById('total-time').textContent = formatTime(audio.duration);
        });

        audio.addEventListener('timeupdate', () => {
            const progress = (audio.currentTime / audio.duration) * 100;
            document.getElementById('progress').style.width = `${progress}%`;
            document.getElementById('current-time').textContent = formatTime(audio.currentTime);
        });

        // 点击进度条调整播放位置
        document.querySelector('.progress-bar').addEventListener('click', (e) => {
            if (!audio.duration) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        });

        audio.addEventListener('ended', () => {
            playNext();
        });

        audio.addEventListener('error', () => {
            console.error('音频播放错误');
        });

        // 下载并解析ID3标签
        async function fetchID3Tags(path) {
            try {
                const url = `/api/cloud/download/${encodeURIComponent(path)}`;
                const res = await fetch(url, { headers: { Range: 'bytes=0-300000' } }); // 增加到300KB
                if (!res.ok) {
                    console.log('获取音频文件失败:', path);
                    return null;
                }
                const buf = await res.arrayBuffer();
                return parseID3v2(buf);
            } catch (e) {
                console.error('fetchID3Tags错误:', e);
                return null;
            }
        }

        function parseID3v2(arrayBuffer) {
            try {
                const dv = new DataView(arrayBuffer);
                // check ID3 header
                if (dv.byteLength < 10) return null;
                if (String.fromCharCode(dv.getUint8(0), dv.getUint8(1), dv.getUint8(2)) !== 'ID3') {
                    console.log('文件不包含ID3v2标签或不是MP3文件');
                    return null;
                }
                const version = dv.getUint8(3); // 3 or 4
                const flags = dv.getUint8(5);
                const tagSize = (dv.getUint8(6) & 0x7f) * 0x200000 + (dv.getUint8(7) & 0x7f) * 0x400 + (dv.getUint8(8) & 0x7f) * 0x80 + (dv.getUint8(9) & 0x7f);
                let pos = 10;
                const end = Math.min(10 + tagSize, dv.byteLength);
                const textDecoderUtf8 = new TextDecoder('utf-8');
                const textDecoderIso = new TextDecoder('iso-8859-1');
                const meta = {};
                let foundAPIC = false;

                while (pos + 10 <= end) {
                    const id = String.fromCharCode(dv.getUint8(pos), dv.getUint8(pos+1), dv.getUint8(pos+2), dv.getUint8(pos+3));
                    const frameSize = dv.getUint32(pos+4);
                    const frameFlags = dv.getUint16(pos+8);
                    const frameStart = pos + 10;
                    const frameEnd = frameStart + frameSize;
                    if (frameEnd > dv.byteLength) break;

                    if (['TIT2','TPE1','TALB'].includes(id)) {
                        const encoding = dv.getUint8(frameStart);
                        const contentBytes = new Uint8Array(arrayBuffer, frameStart + 1, Math.max(0, frameSize - 1));
                        let text = '';
                        if (encoding === 0) {
                            text = textDecoderIso.decode(contentBytes);
                        } else if (encoding === 1) {
                            text = new TextDecoder('utf-16').decode(contentBytes);
                        } else if (encoding === 3) {
                            text = textDecoderUtf8.decode(contentBytes);
                        } else {
                            text = textDecoderUtf8.decode(contentBytes);
                        }
                        if (id === 'TIT2') meta.title = text.replace(/\u0000/g, '').trim();
                        if (id === 'TPE1') meta.artist = text.replace(/\u0000/g, '').trim();
                        if (id === 'TALB') meta.album = text.replace(/\u0000/g, '').trim();
                    } else if (id === 'APIC') {
                        // APIC: text encoding (1) + mime (x00) + picture type (1) + desc (x00) + image data
                        try {
                            const encoding = dv.getUint8(frameStart);
                            let i = frameStart + 1;
                            // read mime type
                            let mime = '';
                            while (i < frameEnd && dv.getUint8(i) !== 0) {
                                mime += String.fromCharCode(dv.getUint8(i)); 
                                i++; 
                            }
                            i++; // skip null terminator
                            if (i >= frameEnd) { 
                                console.log('APIC帧过短: 无法读取mime类型');
                                pos = frameEnd; 
                                continue; 
                            }
                            
                            // picture type
                            const picType = dv.getUint8(i); 
                            i++;
                            
                            // description (可能是UTF-16编码，先跳过)
                            if (encoding === 1 || encoding === 2) {
                                // UTF-16 或其他宽字符编码
                                while (i + 1 < frameEnd && !(dv.getUint8(i) === 0 && dv.getUint8(i+1) === 0)) { 
                                    i += 2; 
                                }
                                i += 2; // skip 0x0000
                            } else {
                                // ISO-8859-1 或 UTF-8
                                while (i < frameEnd && dv.getUint8(i) !== 0) { 
                                    i++; 
                                }
                                i++; // skip 0
                            }
                            
                            if (i >= frameEnd) { 
                                console.log('APIC帧过短: 无法读取描述');
                                pos = frameEnd; 
                                continue; 
                            }
                            
                            const imageData = arrayBuffer.slice(i, frameEnd);
                            if (imageData.byteLength > 0) {
                                const blob = new Blob([imageData], { type: mime || 'image/jpeg' });
                                try {
                                    const url = URL.createObjectURL(blob);
                                    if (url && url.startsWith('blob:')) {
                                        meta.picture = url;
                                        foundAPIC = true;
                                        console.log('成功创建blob URL，大小:', imageData.byteLength, 'MIME:', mime);
                                    }
                                } catch (e) {
                                    console.warn('创建blob URL失败:', e);
                                }
                            } else {
                                console.log('APIC帧没有图片数据');
                            }
                        } catch (e) {
                            console.warn('解析APIC帧失败:', e);
                        }
                    }

                    pos = frameEnd;
                }
                
                if (!foundAPIC) {
                    console.log('ID3v2标签中未找到APIC(图片)帧');
                }

                return meta;
            } catch (e) {
                console.error('parseID3v2异常:', e);
                return null;
            }
        }

        // 控制按钮事件
        document.getElementById('play-btn').addEventListener('click', () => {
            if (playlist.length === 0) return;
            
            if (isPlaying) {
                audio.pause();
                document.getElementById('play-btn').innerHTML = '<i class="fa fa-play"></i>';
            } else {
                audio.play();
                document.getElementById('play-btn').innerHTML = '<i class="fa fa-pause"></i>';
            }
            isPlaying = !isPlaying;
        });

        document.getElementById('prev-btn').addEventListener('click', () => {
            playPrev();
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            playNext();
        });

        document.getElementById('loop-btn').addEventListener('click', () => {
            toggleLoopMode();
        });

        document.getElementById('volume-btn').addEventListener('click', () => {
            audio.volume = audio.volume > 0 ? 0 : 1;
            document.getElementById('volume-btn').innerHTML = 
                audio.volume > 0 ? '<i class="fa fa-volume-up"></i>' : '<i class="fa fa-volume-off"></i>';
        });

        document.getElementById('refresh-playlist').addEventListener('click', () => {
            loadPlaylistFromDirectory(currentPath);
        });

        // 下一首（遵循循环模式）
        function playNext() {
            if (loopMode === 1) {
                // 单曲循环：重新播放当前曲目
                loadSong(currentSongIndex);
            } else if (loopMode === 2) {
                // 列表循环：播放下一首，到末尾回到开头
                currentSongIndex++;
                if (currentSongIndex >= playlist.length) {
                    currentSongIndex = 0;
                }
                loadSong(currentSongIndex);
            } else {
                // 顺序播放：播放下一首，末尾停止
                currentSongIndex++;
                if (currentSongIndex < playlist.length) {
                    loadSong(currentSongIndex);
                } else {
                    // 列表播完，停止播放
                    audio.pause();
                    isPlaying = false;
                    document.getElementById('play-btn').innerHTML = '<i class="fa fa-play"></i>';
                }
            }
            renderPlaylist();
        }

        // 切换循环模式
        function toggleLoopMode() {
            loopMode = (loopMode + 1) % 3; // 0 => 1 => 2 => 0
            updateLoopModeButton();
        }

        // 更新循环模式按钮样式
        function updateLoopModeButton() {
            const loopBtn = document.getElementById('loop-btn');
            if (!loopBtn) return;
            /* 用语义类而非 Tailwind 调色类，避免与设计令牌脱节 */
            loopBtn.classList.remove('is-active', 'is-idle');
            if (loopMode === 0) {
                loopBtn.innerHTML = '<i class="fa fa-repeat"></i>';
                loopBtn.classList.add('is-idle');
                loopBtn.title = '顺序播放';
            } else if (loopMode === 1) {
                loopBtn.innerHTML = '<i class="fa fa-repeat"></i><span class="loop-badge">1</span>';
                loopBtn.classList.add('is-active');
                loopBtn.title = '单曲循环';
            } else {
                loopBtn.innerHTML = '<i class="fa fa-repeat"></i>';
                loopBtn.classList.add('is-active');
                loopBtn.title = '列表循环';
            }
        }

        // 上一首
        function playPrev() {
            currentSongIndex--;
            if (currentSongIndex < 0) {
                currentSongIndex = playlist.length - 1;
            }
            loadSong(currentSongIndex);
            renderPlaylist();
        }

        // 关闭按钮功能
        // 用语义类而非 Tailwind 工具类：宽屏下播放列表占右侧 340px，
        // 若固定贴右上角会压住"播放列表"标题，因此交给 CSS 按断点定位。
        const closeBtn = document.createElement('button');
        closeBtn.className = 'player-close-btn';
        closeBtn.innerHTML = '<i class="fa fa-times"></i>';
        closeBtn.title = '关闭';
        closeBtn.onclick = () => {
            audio.pause();
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = '/';
            }
        };
        document.body.appendChild(closeBtn);
    </script>
</body>
</html>
